name: Parse Marktplaats

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Кол-во страниц'
        required: false
        default: '3'
      links:
        description: 'Свои ссылки (через перевод строки)'
        required: false
        default: ''

concurrency:
  group: parse-marktplaats
  cancel-in-progress: false

jobs:
  run-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Принудительная настройка DNS (защита от ошибки Temporary failure resolving)
      - name: Set up DNS
        run: |
          sudo sh -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf'
          sudo sh -c 'echo "nameserver 8.8.4.4" >> /etc/resolv.conf'

      # Кэшируем браузеры (используем v3, чтобы сбросить старый проблемный кэш)
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v3-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-v3-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # Установка выполняется ТОЛЬКО если кэш не найден или битый
      # Команда --with-deps сразу ставит и системные библиотеки, и браузер
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium chromium-headless-shell

      # --- Запуск парсера ---
      - name: Run parser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          INPUT_PAGES: ${{ inputs.pages || '3' }}
          INPUT_LINKS: ${{ inputs.links || '' }}
        run: python -u main.py
