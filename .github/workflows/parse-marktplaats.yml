name: Parse Marktplaats

on:
  schedule:
    - cron: '0 * * * *' # Каждый час
  workflow_dispatch:    # Ручной запуск

jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Кэш Python-библиотек
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      # --- БЛОК КЭШИРОВАНИЯ БРАУЗЕРА PLAYWRIGHT ---
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> $GITHUB_OUTPUT
        
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          
      # Если кэша нет - качаем браузер со всеми зависимостями
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
        
      # Если кэш ЕСТЬ - браузер не качаем, но ставим системные библиотеки для него (быстро)
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      # -------------------------------------------
        
      - name: Run parser
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py
