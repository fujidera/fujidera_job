name: Telegram Bot Daemon

on:
  schedule:
    - cron: '0 */12 * * *' # Страховка: раз в 12 часов
  workflow_dispatch:       # Ручной запуск

# Эта группа отличается от группы парсера (parse-marktplaats), 
# поэтому они будут работать параллельно и не будут мешать друг другу.
concurrency:
  group: telegram-bot
  cancel-in-progress: false 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Жесткий лимит GitHub 360 минут. Оставляем запас.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_WORKFLOW: parse.yml
        run: python -u bot.py

      - name: Self-trigger next run
        if: always() # Запускаем, даже если бот упал или его убило
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches \
            -d '{"ref":"main"}'
